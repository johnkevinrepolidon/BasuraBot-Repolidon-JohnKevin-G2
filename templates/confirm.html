{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn danger">{{ confirm_label }}</button>
    <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
